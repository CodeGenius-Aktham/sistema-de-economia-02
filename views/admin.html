<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f3f4fb" />
    <title>Panel de administración</title>
    <link rel="icon" href="/img/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" />
    <link rel="stylesheet" href="/css/styles.css?v=__V__" />
    <script src="/js/theme.js?v=__V__"></script>
  </head>
  <body>
    
    <div class="shell">
      <aside class="sidebar">
        <a class="brand" href="#/resumen">
          <div class="brand-logo" data-brand-logo></div>
          <div class="brand-text"><strong data-site-name></strong><span data-site-tagline></span></div>
        </a>
        <nav class="side-nav" id="side-nav" aria-label="Navegación principal"></nav>
        <div class="side-footer">
          <div class="user-card">
            <div class="avatar" data-user-avatar></div>
            <div class="meta"><strong data-user-name></strong><span data-user-role></span></div>
            <button type="button" class="icon-btn sm plain" data-logout title="Cerrar sesión" aria-label="Cerrar sesión"></button>
          </div>
        </div>
      </aside>

      <div class="main">
        <header class="topbar">
          <div class="topbar-left">
            <a href="#/resumen" class="brand-logo" data-brand-logo aria-label="Resumen"></a>
            <div class="topbar-title"><h1 id="page-title">Resumen</h1><p id="page-sub" hidden></p></div>
          </div>
          <div class="topbar-actions">
            <a class="btn btn-ghost btn-sm hide-mobile" href="/app" target="_blank" rel="noopener" id="view-as-student"></a>
            <button type="button" class="icon-btn" data-theme-toggle></button>
            <button type="button" class="icon-btn mobile-only" data-logout title="Cerrar sesión" aria-label="Cerrar sesión"></button>
          </div>
        </header>
        <main id="view" class="view"></main>
      </div>

      <nav class="bottom-nav" id="bottom-nav" aria-label="Navegación"></nav>
    </div>
    <div id="modal-root"></div>
    <div id="toast-root"></div>

    <script src="/js/common.js?v=__V__"></script>
    <script src="/js/admin.js?v=__V__"></script>
  </body>
</html>
